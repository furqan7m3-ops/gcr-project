services:
  postgres:
    image: postgres:17-alpine
    container_name: gcr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gcr_dev
      POSTGRES_USER: gcr
      POSTGRES_PASSWORD: gcr_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcr -d gcr_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
